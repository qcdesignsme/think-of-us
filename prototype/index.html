<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Add Tasks Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tokens from the MC Source of Truth Design Library (mc_base / mc_primitives). Layout: admin page, 3-step flow, table + selected-tasks rail. */
  --bg-primary:#FFFFFF;
  --bg-secondary:#BCCCDC;
  --bg-tertiary:#F0F4F8;
  --bg-disabled:#D9E2EC;
  --bg-inverse:#0A6C74;      /* cyan500: primary action */
  --bg-inverse-hover:#04484E;/* cyan600 */
  --bg-dark:#091F34;         /* gray900 */
  --bg-accent:#276EF1;       /* blue400: completed step */
  --cyan-50:#C7FAFF;
  --content-primary:#091F34;
  --content-secondary:#243B53;
  --content-tertiary:#486581;
  --content-disabled:#7E97AF;
  --content-accent:#A30664;  /* purple500: checked */
  --content-negative:#911111;
  --content-positive:#0F6B55;
  --bg-light-positive:#D0F6E4;
  --border-positive:#1C926E;
  --bg-light-negative:#FFE0E0;
  --border-negative:#BA2525;
  --border-opaque:#BCCCDC;
  --radius:5px;
  --font:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-tertiary);color:var(--content-primary);font:400 16px/24px var(--font)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bg-accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}
.heading-m{font:600 29px/36px var(--font)}
.heading-xs{font:600 20px/28px var(--font)}
.label-l{font:500 18px/24px var(--font)}
.label-m{font:500 16px/20px var(--font)}
.label-s{font:500 14px/16px var(--font)}
.para-s{font:400 14px/20px var(--font)}
.muted{color:var(--content-tertiary)}

.topbar{background:var(--bg-primary);box-shadow:0 2px 6px rgba(9,31,52,.12);padding:14px 24px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--content-tertiary)}
.brand i{width:32px;height:32px;border-radius:50%;border:2px solid var(--bg-inverse);display:block}
.proto-note{font-size:13px;color:var(--content-tertiary);background:var(--bg-tertiary);border-radius:999px;padding:4px 12px}
.page{margin:0 auto;padding:40px 64px 80px;display:grid;gap:24px}
.page-head{display:grid;gap:2px;justify-items:start}
.page-head .btn{margin-top:24px}

.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--radius);border:0;cursor:pointer;font:500 16px/20px var(--font);text-decoration:none}
.btn svg{flex:none}
.btn-secondary{background:var(--bg-secondary);color:var(--content-primary)}
.btn-secondary:hover{background:#A9BCCF}
.btn-primary{background:var(--bg-inverse);color:#fff}
.btn-primary:hover{background:var(--bg-inverse-hover)}
.btn-primary[disabled]{background:var(--cyan-50);color:var(--content-disabled);cursor:not-allowed}
.btn-tertiary{background:transparent;color:var(--content-primary)}
.btn-tertiary:hover{background:var(--bg-disabled)}
.btn-link{background:none;border:0;padding:0;min-height:0;color:var(--bg-inverse);cursor:pointer;font:500 14px/20px var(--font);display:inline-flex;align-items:center;gap:4px}
.btn-link:hover{color:var(--bg-inverse-hover);text-decoration:underline}
.btn-danger{background:none;border:0;color:var(--content-negative);cursor:pointer;display:inline-flex;gap:8px;align-items:center;font:500 16px/20px var(--font);min-height:44px;padding:0 8px;border-radius:var(--radius)}
.btn-danger:hover{background:var(--bg-light-negative)}

/* stepper */
.stepper{list-style:none;margin:16px auto 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);max-width:1020px;width:100%}
.stepper li{position:relative;display:grid;justify-items:center;gap:8px;text-align:center}
.stepper li+li::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:2px;background:var(--bg-disabled);z-index:0}
.stepper li.done+li::before,.stepper li.current::before{background:var(--bg-dark)}
.stepper li.done::before{background:var(--bg-accent)}
.step-dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:500 16px/1 var(--font);background:var(--bg-disabled);color:var(--content-tertiary);border:0}
.stepper .current .step-dot{background:var(--bg-dark);color:#fff}
.stepper .done .step-dot{background:var(--bg-accent);color:#fff;cursor:pointer}
.step-name{color:var(--content-tertiary)}
.stepper .current .step-name,.stepper .done .step-name{color:var(--content-primary)}

/* notification */
.notice{border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.positive{background:var(--bg-light-positive);border:1px solid var(--border-positive);color:#064B3E}
.notice.negative{background:var(--bg-light-negative);border:1px solid var(--border-negative);color:#780A0A}

/* step 1 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:0 1 420px;min-width:220px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.input,.select{width:100%;min-height:44px;border:2px solid var(--content-tertiary);border-radius:2px;background:#fff;padding:8px 12px}
.search .input{padding-left:44px}
.input::placeholder{color:var(--content-tertiary)}
.input[aria-invalid="true"]{border-color:var(--border-negative)}
.field-error{color:var(--content-negative);font-size:14px}
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.filter-row>div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pager{display:flex;gap:18px;align-items:center}
.pager button{background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;color:var(--content-primary);font:500 16px/20px var(--font)}
.pager button[disabled]{color:var(--content-disabled);cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--border-opaque);background:#fff;border-radius:32px;padding:2px 6px 2px 12px;font:500 14px/20px var(--font)}
.chip button{border:0;background:none;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.chip button:hover{background:var(--bg-tertiary)}
.tag{display:inline-block;border:2px solid var(--border-opaque);background:#fff;border-radius:32px;padding:2px 12px;font:500 14px/20px var(--font)}

/* Layout guide from Qian's mockup: 12 columns, stretch, 64px margin, 36px gutter. Table spans 9, Selected Tasks spans 3. */
.step1{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:36px;align-items:start}
.step1>.intro{grid-column:1/-1;margin:4px 0 32px}
.controls{grid-column:1/span 9;display:grid;gap:32px;margin-bottom:24px}
.chip-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:-8px}
.table-col{grid-column:1/span 9;grid-row:3;min-width:0;display:grid;gap:32px}
.rail{grid-column:10/span 3;grid-row:3;background:#fff;border:1px solid var(--border-opaque);position:sticky;top:24px}
.rest{grid-column:1/span 9;display:grid;gap:32px;margin-top:40px}
.pager-end{display:flex;justify-content:flex-end}
.pager{padding-right:16px}
.rail h2{padding:14px 16px;border-bottom:1px solid var(--border-opaque);font:500 16px/20px var(--font)}
.rail-body{padding:20px 20px 16px;display:grid;gap:20px}
.rail h3{font:500 16px/20px var(--font);padding-bottom:8px;border-bottom:2px solid var(--bg-tertiary)}
.rail ul{list-style:none;margin:0;padding:0 2px;display:grid;gap:22px}
.rail-group{display:grid;gap:18px}
.rail-group+.rail-group{margin-top:16px}
.rail li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}

.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border-opaque)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 16px;font-size:14px;line-height:20px;vertical-align:middle}
thead th{padding:14px 16px}
thead th{font:500 16px/20px var(--font);border-bottom:1px solid var(--border-opaque);border-right:1px solid var(--border-opaque)}
thead th:last-child{border-right:0}
th button.sort{background:none;border:0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;font:inherit;padding:0;min-height:28px}
tbody tr.row:nth-of-type(even of .row){background:#F4F6F9}
tbody tr.row:hover{background:var(--bg-tertiary)}
.col-check{width:56px}.col-exp{width:44px}.col-id{width:110px}.col-target{width:280px}
.icon-btn{border:0;background:none;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius)}
.icon-btn:hover{background:var(--bg-disabled)}
.icon-btn svg{transition:transform .15s}
.icon-btn[aria-expanded="true"] svg{transform:rotate(90deg)}
tr.detail td{border-top:1px solid var(--border-opaque);border-bottom:1px solid var(--border-opaque);padding:24px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px}
.detail-grid>div:nth-child(even){border-left:1px solid var(--border-opaque);padding-left:40px}
.detail-grid dt{font:600 18px/24px var(--font);margin-bottom:6px}
.detail-grid dd{margin:0;font-size:16px;overflow-wrap:anywhere}
.empty{padding:40px 24px;text-align:center;display:grid;gap:12px;justify-items:center}

input[type=checkbox]{appearance:none;width:20px;height:20px;border:2px solid var(--content-tertiary);border-radius:2px;background:#fff;cursor:pointer;flex:none;margin:2px 0 0;display:inline-grid;place-items:center}
input[type=checkbox]:checked,input[type=checkbox]:indeterminate{background:var(--content-accent);border-color:var(--content-accent)}
input[type=checkbox]:checked::after{content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
input[type=checkbox]:indeterminate::after{content:"";width:10px;height:2px;background:#fff}
td input[type=checkbox],th input[type=checkbox]{margin:0;vertical-align:middle}

.actions-row{display:flex;gap:12px;flex-wrap:wrap}
.cta-card{background:#fff;border:1px solid var(--border-opaque);padding:28px 20px;text-align:center;display:grid;gap:14px;justify-items:center}

/* step 2 & 3 */
.narrow{max-width:760px;width:100%;margin:0 auto;display:grid;gap:24px}
.card{background:#fff;border:1px solid var(--border-opaque)}
.card>h2{padding:14px 18px;border-bottom:1px solid var(--border-opaque)}
.card-body{padding:20px 18px;display:grid;grid-template-columns:1fr 1fr;gap:24px 32px}
.card-body>div+div{border-left:1px solid var(--border-opaque);padding-left:32px}
.fields{display:grid;gap:16px;align-content:start}
.field{display:grid;gap:6px}
.card-foot{border-top:1px solid var(--border-opaque);padding:8px 18px;display:flex;justify-content:flex-end}
.global dt{font-size:14px;line-height:20px}.global dd{margin:0 0 14px;overflow-wrap:anywhere}
.global a{color:var(--content-tertiary)}
.hint{border-top:1px solid var(--bg-disabled);padding-top:14px;font-size:14px;line-height:20px}
.review{padding:8px 18px 4px}
.review-item{display:grid;grid-template-columns:150px 1fr auto;gap:12px 20px;padding:20px 0;border-bottom:1px solid var(--border-opaque);align-items:start}
.review-item:last-child{border-bottom:0}
.review-item dl{margin:0;display:grid;gap:12px;font-size:14px;line-height:20px}
.review-item dd{margin:0}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border-opaque);border-radius:var(--radius);box-shadow:0 6px 18px rgba(9,31,52,.18);min-width:190px;padding:6px;z-index:5;display:grid}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;min-height:44px;cursor:pointer;border-radius:3px;font:400 16px/20px var(--font)}
.menu button:hover,.menu button:focus-visible{background:var(--bg-tertiary)}
.menu .neg{color:var(--content-negative)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:#fff;width:min(420px,100%);height:100%;display:flex;flex-direction:column}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px 8px}
.drawer-body{flex:1;overflow:auto;padding:8px 24px 24px;display:grid;gap:12px;align-content:start}
fieldset{border:0;margin:0;padding:0}
legend{font:500 16px/20px var(--font);padding:12px 0}
.group{background:var(--bg-tertiary);padding:16px 18px;display:grid;gap:10px}
.group label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:28px}
.drawer-foot{padding:16px 24px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--bg-disabled)}
[hidden]{display:none !important}

@media (max-width:960px){
  .step1{grid-template-columns:1fr}
  .controls,.table-col,.rail,.rest{grid-column:1;grid-row:auto}
  .rail{position:static;margin-top:32px}
  .step-name{font-size:14px;max-width:12ch}
}
@media (max-width:820px){
  .page{padding:24px 16px 64px}
  .card-body{grid-template-columns:1fr}
  .card-body>div+div{border-left:0;padding-left:0;border-top:1px solid var(--border-opaque);padding-top:20px}
  .detail-grid{grid-template-columns:1fr}
  .detail-grid>div:nth-child(even){border-left:0;padding-left:0}
  .review-item{grid-template-columns:1fr}
  .step-name{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><i aria-hidden="true"></i>admin</span>
  <span class="proto-note">Portfolio prototype by Qian Chen · sample data</span>
</header>

<main class="page" id="app">
  <div class="page-head">
    <h1 class="heading-m">Add Task(s) - Clickable Link</h1>
    <p>Partner Up Houston (sample program)</p>
    <button class="btn btn-secondary" type="button" id="backToProgram">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      Back to Program Content
    </button>
  </div>

  <ol class="stepper" id="stepper" aria-label="Progress"></ol>
  <div id="live" class="sr" aria-live="polite"></div>
  <div id="notice"></div>
  <div id="view"></div>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <h2 class="heading-xs" id="drawerTitle">Filter Tasks</h2>
      <button class="icon-btn" type="button" id="drawerClose" aria-label="Close filters">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m7 7 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <form class="drawer-body" id="filterForm">
      <fieldset>
        <legend>Participant Type</legend>
        <div class="group">
          <button class="btn-link" type="button" data-clear="target">Clear Filter</button>
          <label><input type="checkbox" name="target" value="Mentors" id="f-mentors"> Mentor</label>
          <label><input type="checkbox" name="target" value="Mentees" id="f-mentees"> Mentee</label>
          <label><input type="checkbox" name="target" value="Both" id="f-both"> Both</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Program Segment</legend>
        <div class="group">
          <button class="btn-link" type="button" data-clear="segment">Clear Filter</button>
          <label><input type="checkbox" name="segment" value="Student Success" id="f-ss"> Student Success</label>
          <label><input type="checkbox" name="segment" value="Enrollment" id="f-en"> Enrollment</label>
          <label><input type="checkbox" name="segment" value="Adult/Online" id="f-ao"> Adult/Online</label>
          <label><input type="checkbox" name="segment" value="Career" id="f-ca"> Career</label>
          <label><input type="checkbox" name="segment" value="Corporate" id="f-co"> Corporate</label>
        </div>
      </fieldset>
    </form>
    <div class="drawer-foot">
      <button class="btn btn-tertiary" type="button" id="drawerClearAll">Clear all filters</button>
      <button class="btn btn-primary" type="button" id="drawerApply">Apply</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
/* ---------- sample data ---------- */
const cf = n => ({ name:"Connected Futures Lesson "+n, target:"Mentees", segment:"Career", url:"https://www.connectedfutures.com/lesson"+n });
const TASKS = [
  ...Array.from({length:12},(_,i)=>cf(i+1)),
  {name:"Career Mentor Training", target:"Mentors", segment:"Career", url:"https://example.com/career-mentor-training"},
  {name:"Complete Mentoring Relationship Agreement", target:"Both", segment:"Career", url:"https://example.com/relationship-agreement"},
  {name:"Career Mentoring Closure Activity", target:"Both", segment:"Career", url:"https://example.com/closure-activity"},
  {name:"Example of a really long task title that wraps to a second line", target:"Mentees", segment:"Career", url:"https://example.com/long-title"},
  {name:"First-Year Success Checklist", target:"Mentees", segment:"Student Success", url:"https://example.com/first-year-checklist"},
  {name:"Student Success Mentor Training", target:"Mentors", segment:"Student Success", url:"https://example.com/ss-mentor-training"},
  {name:"Campus Resources Scavenger Hunt", target:"Mentees", segment:"Student Success", url:"https://example.com/campus-resources"},
  {name:"Admitted Student Next Steps", target:"Mentees", segment:"Enrollment", url:"https://example.com/next-steps"},
  {name:"Balancing Work and School", target:"Mentees", segment:"Adult/Online", url:"https://example.com/work-and-school"},
  {name:"Online Learner Mentor Training", target:"Mentors", segment:"Adult/Online", url:"https://example.com/online-mentor-training"},
  {name:"New Hire Mentorship Kickoff", target:"Both", segment:"Corporate", url:"https://example.com/new-hire-kickoff"}
].map((t,i)=>({id:201+i, ...t}));
const PAGE = 6;

/* ---------- state ---------- */
const S = {
  step:1, query:"", applied:{target:[], segment:["Career"]},
  sort:{key:"id",dir:1}, page:0, expanded:new Set(),
  selected:[],            // ids in selection order
  edits:{},               // id -> {target, display}
  showGlobal:new Set(), menu:null, errors:{}, added:null
};
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = id=>TASKS.find(t=>t.id===id);
const edit = id=>S.edits[id] || (S.edits[id]={target:byId(id).target, display:byId(id).name});
const say = t=>{ $("#live").textContent=""; setTimeout(()=>$("#live").textContent=t,30); };
const ICON = {
  chev:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  left:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  down:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 6 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  sort:'<svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="m3 6 3-3 3 3M3 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 3 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.8"/></svg>',
  search:'<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="1.5"/></svg>',
  filter:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3 1V8.5z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  remove:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="currentColor"/><path d="m6 6 6 6m0-6-6 6" stroke="#fff" stroke-width="1.6"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};

/* ---------- derived ---------- */
function filtered(){
  const q=S.query.trim().toLowerCase(), a=S.applied;
  let r=TASKS.filter(t=>(!q||t.name.toLowerCase().includes(q)||String(t.id).includes(q))
    &&(!a.target.length||a.target.includes(t.target))
    &&(!a.segment.length||a.segment.includes(t.segment)));
  const k=S.sort.key,d=S.sort.dir;
  return r.sort((x,y)=>(x[k]>y[k]?1:x[k]<y[k]?-1:0)*d);
}
const filterCount=()=>S.applied.target.length+S.applied.segment.length;
const groupSel=which=>S.selected.filter(id=>{const t=edit(id).target;return which==="Mentees"?t!=="Mentors":t!=="Mentees"});

/* ---------- stepper ---------- */
function renderStepper(){
  const names=["Find Task from List","Edit Task Details","Review and Save"];
  $("#stepper").innerHTML=names.map((n,i)=>{
    const k=i+1, cls=k<S.step?"done":k===S.step?"current":"";
    const dot=k<S.step
      ? `<button class="step-dot" type="button" data-go="${k}" aria-label="Go back to step ${k}: ${n}">${ICON.check}</button>`
      : `<span class="step-dot" aria-hidden="true">${k}</span>`;
    return `<li class="${cls}" ${k===S.step?'aria-current="step"':''}>${dot}<span class="step-name"><span class="sr">Step ${k}: </span>${n}</span></li>`;
  }).join("");
}

/* ---------- step 1 ---------- */
function railHTML(){
  const grp=(label,ids)=>`<div class="rail-group"><h3>For ${label} (${ids.length})</h3>`+(ids.length
    ? `<ul>${ids.map(id=>`<li><label><input type="checkbox" checked data-unsel="${id}" id="rail-${label}-${id}"> <span>${esc(byId(id).name)}</span></label></li>`).join("")}</ul>`
    : `<p>No tasks added. Add tasks by selecting them from the table</p>`)+`</div>`;
  return `<aside class="rail" aria-label="Selected tasks">
    <h2>Selected Tasks (${S.selected.length})</h2>
    <div class="rail-body"><p>The tasks you select on the table will appear here</p>
    ${grp("Mentees",groupSel("Mentees"))}${grp("Mentors",groupSel("Mentors"))}</div></aside>`;
}
function step1(){
  const rows=filtered(), pages=Math.max(1,Math.ceil(rows.length/PAGE));
  if(S.page>=pages)S.page=pages-1;
  const pageRows=rows.slice(S.page*PAGE,S.page*PAGE+PAGE);
  const allOn=pageRows.length&&pageRows.every(t=>S.selected.includes(t.id));
  const someOn=pageRows.some(t=>S.selected.includes(t.id));
  const chips=[...S.applied.target.map(v=>["target",v]),...S.applied.segment.map(v=>["segment",v])];
  const pager=`<div class="pager"><button type="button" data-page="-1" ${S.page===0?"disabled":""}>${ICON.left} Prev</button>
    <button type="button" data-page="1" ${S.page>=pages-1?"disabled":""}>Next ${ICON.chev}</button>
    <span>${rows.length} result${rows.length===1?"":"s"} total</span></div>`;
  const ariaSort=k=>S.sort.key===k?(S.sort.dir===1?"ascending":"descending"):"none";
  const body=pageRows.length?pageRows.map(t=>{
    const on=S.selected.includes(t.id), ex=S.expanded.has(t.id);
    return `<tr class="row ${on?"sel":""}">
      <td class="col-check"><input type="checkbox" id="row-${t.id}" data-sel="${t.id}" ${on?"checked":""} aria-label="Select ${esc(t.name)}"></td>
      <td class="col-exp"><button class="icon-btn" type="button" data-exp="${t.id}" aria-expanded="${ex}" aria-label="${ex?"Hide":"Show"} details for ${esc(t.name)}">${ICON.chev}</button></td>
      <td>${t.id}</td><td>${esc(t.name)}</td><td>${t.target==="Both"?"Mentors & Mentees":t.target}</td></tr>`+
      (ex?`<tr class="detail"><td colspan="5"><dl class="detail-grid">
        <div><dt>Default Target Audience</dt><dd>${t.target==="Both"?"Mentors & Mentees":t.target}</dd></div>
        <div><dt>Program Segment</dt><dd><span class="tag">${t.segment}</span></dd></div>
        <div><dt>Display Name (For Mentors &amp; Mentees)</dt><dd>${esc(t.name)}</dd></div>
        <div><dt>Task Name (Internal)</dt><dd>${esc(t.name)}</dd></div>
        <div><dt>URL</dt><dd>${esc(t.url)}</dd></div></dl></td></tr>`:"");
  }).join(""):`<tr><td colspan="5"><div class="empty"><p class="label-l">No tasks match your search</p><p>Try a different keyword, or clear your filters.</p><button class="btn btn-secondary" type="button" data-clearall>Clear All Filters</button></div></td></tr>`;
  return `<div class="step1">
  <p class="label-l intro" style="font-weight:400">The tasks list is pre-filtered by your program segment. Select the task you'd like to add to your program.</p>
  <div class="controls">
    <form class="toolbar" id="searchForm" role="search">
      <div class="search">${ICON.search}<label class="sr" for="q">Search by keyword</label>
      <input class="input" id="q" type="search" placeholder="Search by keyword" value="${esc(S.query)}" autocomplete="off"></div>
      <button class="btn btn-secondary" type="submit">Search</button>
    </form>
    <div class="filter-row"><div>
      <button class="btn btn-secondary" type="button" id="openFilters">${ICON.filter} ${filterCount()?filterCount()+" Filter"+(filterCount()>1?"s":"")+" Applied":"Filters"}</button>
      ${filterCount()?`<button class="btn btn-tertiary" type="button" data-clearall>Clear All Filters</button>`:""}
    </div></div>
    <div class="chip-row">${chips.length?`<ul class="chips" aria-label="Applied filters">${chips.map(([k,v])=>`<li class="chip">${k==="segment"?"Program Segment: ":"Participant Type: "}${esc(v==="Mentors"?"Mentor":v==="Mentees"?"Mentee":v)}<button type="button" data-chip="${k}|${esc(v)}" aria-label="Remove filter ${esc(v)}">${ICON.x}</button></li>`).join("")}</ul>`:"<span></span>"}${pager}</div>
  </div>
  <div class="table-col">
    <div class="table-wrap"><table>
      <caption class="sr">Tasks you can add to this program</caption>
      <thead><tr>
        <th class="col-check" scope="col"><input type="checkbox" id="selAll" ${allOn?"checked":""} aria-label="Select all tasks on this page"></th>
        <th class="col-exp" scope="col"><span class="sr">Details</span></th>
        <th class="col-id" scope="col" aria-sort="${ariaSort("id")}"><button class="sort" type="button" data-sort="id">ID ${ICON.sort}</button></th>
        <th scope="col" aria-sort="${ariaSort("name")}"><button class="sort" type="button" data-sort="name">Internal Task Name ${ICON.sort}</button></th>
        <th class="col-target" scope="col" aria-sort="${ariaSort("target")}"><button class="sort" type="button" data-sort="target">Target ${ICON.sort}</button></th>
      </tr></thead><tbody>${body}</tbody></table></div>
    <div class="pager-end">${pager}</div>
  </div>
  ${railHTML()}
  <div class="rest">
    <div class="actions-row">
      <button class="btn btn-secondary" type="button" data-backprog>${ICON.left} Back to Program Content</button>
      <button class="btn btn-primary" type="button" id="continue1" ${S.selected.length?"":"disabled"}>Continue${S.selected.length?` with ${S.selected.length} task${S.selected.length>1?"s":""}`:""}</button>
    </div>
    <div class="cta-card"><p class="label-l">Can’t find the task you need?</p>
      <button class="btn btn-primary" type="button" id="createNew">Create New Task</button>
      <p class="para-s">*Creating a new task will create a corresponding global task reusable for all programs.</p></div>
  </div>
  </div>`+`<span hidden data-indet="${!allOn&&someOn}"></span>`;
}

/* ---------- step 2 ---------- */
function step2(){
  return `<div class="narrow">${S.selected.map(id=>{const t=byId(id),e=edit(id),err=S.errors[id];
    return `<section class="card" aria-labelledby="c-${id}"><h2 class="heading-xs" id="c-${id}">${esc(t.name)}</h2>
    <div class="card-body">
      <div class="fields"><p class="label-m">Program Task Fields</p>
        <p class="para-s">Fields you can edit but edits do NOT push to programs</p>
        <p class="para-s">All required fields are marked with an asterisk (*)</p>
        <div class="field"><label class="para-s" for="aud-${id}">* Who is this for? (Target Audience)</label>
          <select class="select" id="aud-${id}" data-aud="${id}">${["Mentees","Mentors","Both"].map(o=>`<option value="${o}" ${e.target===o?"selected":""}>${o==="Both"?"Mentors & Mentees":o}</option>`).join("")}</select></div>
        <div class="field"><label class="para-s" for="dn-${id}">* Display Name (for Mentors and Mentees)</label>
          <input class="input" id="dn-${id}" data-dn="${id}" value="${esc(e.display)}" required ${err?`aria-invalid="true" aria-describedby="err-${id}"`:""}>
          ${err?`<span class="field-error" id="err-${id}">Enter a display name. Participants see this name on their dashboard.</span>`:""}</div>
      </div>
      <div><p class="label-m" style="margin-bottom:14px">Global Task Fields</p>
        <dl class="global"><dt>URL</dt><dd><a href="${esc(t.url)}" rel="noopener">${esc(t.url)}</a></dd>
        <dt>Task Name (Internal)</dt><dd>${esc(t.name)}</dd></dl>
        <p class="hint">If you want to make changes to the Global Task, please make changes from the Library.</p></div>
    </div>
    <div class="card-foot"><button class="btn-danger" type="button" data-remove="${id}">${ICON.remove} Remove task from selection</button></div></section>`}).join("")}
  <div class="actions-row"><button class="btn btn-secondary" type="button" data-go="1">Back to Previous Step</button>
  <button class="btn btn-primary" type="button" id="continue2">Continue</button></div></div>`;
}

/* ---------- step 3 ---------- */
function step3(){
  return `<div class="narrow"><section class="card" aria-labelledby="rv"><h2 class="heading-xs" id="rv" style="border-bottom:0;padding-bottom:0">Review and Save</h2>
  <div class="review">${S.selected.map(id=>{const t=byId(id),e=edit(id),g=S.showGlobal.has(id);
    return `<div class="review-item"><p class="label-s" style="line-height:20px">${esc(t.name)}</p>
    <dl><div><dt>Display Name (For Mentors and Mentees)</dt><dd>${esc(e.display)}</dd></div>
      <div><dt>Who is this for? (Target Audience)</dt><dd>${e.target==="Both"?"Mentors & Mentees":e.target}</dd></div>
      <div><button class="btn-link" type="button" data-global="${id}" aria-expanded="${g}">${g?"Hide":"Show"} Global Task Fields ${ICON.down}</button></div>
      ${g?`<div><dt>URL</dt><dd>${esc(t.url)}</dd></div><div><dt>Task Name (Internal)</dt><dd>${esc(t.name)}</dd></div><div><dt>Program Segment</dt><dd>${t.segment}</dd></div>`:""}</dl>
    <div class="menu-wrap"><button class="btn btn-secondary" type="button" data-menu="${id}" aria-haspopup="true" aria-expanded="${S.menu===id}">Actions ${ICON.down}</button>
      ${S.menu===id?`<div class="menu" role="menu"><button type="button" role="menuitem" data-editone="${id}">Edit details</button><button type="button" role="menuitem" class="neg" data-remove="${id}">Remove from selection</button></div>`:""}</div></div>`}).join("")}</div></section>
  <div class="actions-row"><button class="btn btn-secondary" type="button" data-go="2">Back to Previous Step</button>
  <button class="btn btn-primary" type="button" id="addAll">Add (${S.selected.length}) Task${S.selected.length>1?"s":""}</button></div></div>`;
}

function done(){
  return `<div class="narrow"><section class="card"><h2 class="heading-xs">Added to Partner Up Houston</h2>
  <div class="review">${S.added.map(a=>`<div class="review-item" style="grid-template-columns:1fr auto"><p>${esc(a.display)}</p><span class="tag">${a.target==="Both"?"Mentors & Mentees":a.target}</span></div>`).join("")}</div></section>
  <div class="actions-row"><button class="btn btn-primary" type="button" id="restart">Add more tasks</button></div></div>`;
}

/* ---------- render ---------- */
function render(focusSel){
  renderStepper();
  $("#stepper").hidden=!!S.added;
  $("#view").innerHTML=S.added?done():S.step===1?step1():S.step===2?step2():step3();
  const sa=$("#selAll"); if(sa){const flag=$("[data-indet]"); sa.indeterminate=flag&&flag.dataset.indet==="true";}
  if(focusSel){const el=$(focusSel); if(el)el.focus();}
}
function notice(kind,html){ $("#notice").innerHTML=html?`<div class="notice ${kind}" role="status">${html}<button class="icon-btn" type="button" id="noticeClose" aria-label="Dismiss message">${ICON.x}</button></div>`:""; }
function go(step){ S.step=step; S.menu=null; notice(); render(); window.scrollTo({top:0}); $("#stepper").setAttribute("tabindex","-1"); say("Step "+step+" of 3"); }
function toggleSel(id,on){ const i=S.selected.indexOf(id); if(on&&i<0)S.selected.push(id); if(!on&&i>=0)S.selected.splice(i,1); }
function removeTask(id){
  const name=byId(id).name; toggleSel(id,false); delete S.errors[id]; S.menu=null;
  if(!S.selected.length){ S.step=1; notice("negative",`<span>You removed every task, so we brought you back to the list.</span>`); }
  else notice("positive",`<span>Removed “${esc(name)}” from your selection. <button class="btn-link" type="button" data-undo="${id}" style="font-size:16px">Undo</button></span>`);
  render(); say("Removed "+name);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-go]"); if(!t){ if(S.menu!==null&&!e.target.closest(".menu-wrap")){S.menu=null;render();} return; }
  const d=t.dataset;
  if(t.id==="noticeClose"){notice();return;}
  if(d.undo){toggleSel(+d.undo,true);notice();render();return;}
  if(d.go){go(+d.go);return;}
  if(d.page){S.page+=+d.page;render(`[data-page="${d.page}"]`);return;}
  if(d.sort){S.sort=S.sort.key===d.sort?{key:d.sort,dir:-S.sort.dir}:{key:d.sort,dir:1};render(`[data-sort="${d.sort}"]`);return;}
  if(d.exp){const id=+d.exp;S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id);render(`[data-exp="${id}"]`);return;}
  if(d.chip){const [k,v]=d.chip.split("|");S.applied[k]=S.applied[k].filter(x=>x!==v);S.page=0;render("#openFilters");return;}
  if("clearall" in d){S.applied={target:[],segment:[]};S.query="";S.page=0;render("#openFilters");say("Filters cleared");return;}
  if(t.id==="openFilters"){openDrawer();return;}
  if(t.id==="continue1"){go(2);return;}
  if(t.id==="createNew"){notice("positive","<span>Creating a new task is a separate flow and isn’t part of this prototype.</span>");window.scrollTo({top:0});return;}
  if(t.id==="backToProgram"||"backprog" in d){notice("positive","<span>This would return to the program’s content page. It isn’t part of this prototype.</span>");return;}
  if(d.remove){removeTask(+d.remove);return;}
  if(t.id==="continue2"){
    S.errors={}; S.selected.forEach(id=>{ if(!edit(id).display.trim())S.errors[id]=true; });
    const bad=Object.keys(S.errors);
    if(bad.length){notice("negative",`<span>${bad.length} task${bad.length>1?"s need":" needs"} a display name before you can continue.</span>`);render("#dn-"+bad[0]);return;}
    go(3);return;}
  if(d.global){const id=+d.global;S.showGlobal.has(id)?S.showGlobal.delete(id):S.showGlobal.add(id);render(`[data-global="${id}"]`);return;}
  if(d.menu){const id=+d.menu;S.menu=S.menu===id?null:id;render(S.menu===id?`[data-editone="${id}"]`:`[data-menu="${id}"]`);return;}
  if(d.editone){const id=+d.editone;S.step=2;S.menu=null;render("#dn-"+id);return;}
  if(t.id==="addAll"){
    S.added=S.selected.map(id=>({...edit(id)}));const n=S.added.length;
    notice("positive",`<span><strong>${n} task${n>1?"s":""} added.</strong> Mentors and mentees will see ${n>1?"them":"it"} on their dashboards.</span>`);
    render();window.scrollTo({top:0});say(n+" tasks added");return;}
  if(t.id==="restart"){S.added=null;S.selected=[];S.edits={};S.step=1;S.page=0;S.expanded.clear();S.showGlobal.clear();notice();render();return;}
  if(t.id==="drawerClose"){closeDrawer();return;}
  if(t.id==="drawerApply"){
    const f=$("#filterForm");S.applied={target:[...f.querySelectorAll("[name=target]:checked")].map(x=>x.value),segment:[...f.querySelectorAll("[name=segment]:checked")].map(x=>x.value)};
    S.page=0;closeDrawer();render("#openFilters");say(filtered().length+" results");return;}
  if(t.id==="drawerClearAll"){$("#filterForm").querySelectorAll("input").forEach(x=>x.checked=false);return;}
  if(d.clear){$("#filterForm").querySelectorAll(`[name=${d.clear}]`).forEach(x=>x.checked=false);return;}
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.sel){toggleSel(+d.sel,t.checked);render("#row-"+d.sel);return;}
  if(d.unsel){removeFromRail(+d.unsel);return;}
  if(t.id==="selAll"){filtered().slice(S.page*PAGE,S.page*PAGE+PAGE).forEach(x=>toggleSel(x.id,t.checked));render("#selAll");say(S.selected.length+" tasks selected");return;}
  if(d.aud){edit(+d.aud).target=t.value;return;}
});
function removeFromRail(id){toggleSel(id,false);render("#q");say("Removed "+byId(id).name);}
document.addEventListener("input",e=>{const d=e.target.dataset;if(d.dn){edit(+d.dn).display=e.target.value;if(S.errors[+d.dn]&&e.target.value.trim()){delete S.errors[+d.dn];}}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="searchForm"){S.query=$("#q").value;S.page=0;render("#q");say(filtered().length+" results");}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(!$("#scrim").hidden)closeDrawer(); else if(S.menu!==null){const id=S.menu;S.menu=null;render(`[data-menu="${id}"]`);} }
  if(e.key==="Tab"&&!$("#scrim").hidden){const f=[...$(".drawer").querySelectorAll("button,input")];const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
$("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")closeDrawer();});
function openDrawer(){const f=$("#filterForm");f.querySelectorAll("[name=target]").forEach(x=>x.checked=S.applied.target.includes(x.value));f.querySelectorAll("[name=segment]").forEach(x=>x.checked=S.applied.segment.includes(x.value));$("#scrim").hidden=false;$("#drawerClose").focus();}
function closeDrawer(){$("#scrim").hidden=true;const b=$("#openFilters");if(b)b.focus();}

render();
})();
</script>
</body>
</html>
